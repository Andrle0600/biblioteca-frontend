<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-2 sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" routerLink="/dashboard">Dashboard Biblioteca</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" routerLink="/dashboard" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">Vista General</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/libros" routerLinkActive="active">Libros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/ejemplares" routerLinkActive="active">Ejemplares</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/usuarios" routerLinkActive="active">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/reservas" routerLinkActive="active">Reservas Activas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/atrasadas" routerLinkActive="active">Devoluciones
                        Atrasadas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/historial" routerLinkActive="active">Historial</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-success nav-link text-white" routerLink="/"><i
                            class="bi bi-book-fill me-2"></i>Biblioteca</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-danger nav-link text-white" (click)="logout()">
                        <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                    </a>
                </li>
            </ul>

            <!-- ====== SELECTOR DE TAMAÑO DE FUENTE – ESCRITORIO (≥992px) ====== -->
            <div class="dash-font-control d-none d-lg-flex align-items-center ms-auto" aria-label="Tamaño de texto">
                <span class="dash-font-label me-2">
                    <i class="bi bi-type"></i>
                </span>
                <div class="btn-group dash-font-group" role="group" aria-label="Tamaño de fuente">
                    <button type="button"
                        class="btn btn-dash-font"
                        [class.active]="(currentFontSize$ | async) === 'S'"
                        (click)="setFontSize('S')"
                        title="Texto estándar"
                        aria-label="Texto estándar">S</button>
                    <button type="button"
                        class="btn btn-dash-font"
                        [class.active]="(currentFontSize$ | async) === 'M'"
                        (click)="setFontSize('M')"
                        title="Texto mediano"
                        aria-label="Texto mediano">M</button>
                    <button type="button"
                        class="btn btn-dash-font"
                        [class.active]="(currentFontSize$ | async) === 'L'"
                        (click)="setFontSize('L')"
                        title="Texto grande"
                        aria-label="Texto grande">L</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<router-outlet></router-outlet>

<!-- ====== WIDGET FLOTANTE (FAB) DE ACCESIBILIDAD – SOLO MÓVIL (<992px) ====== -->
<div class="dash-font-fab-wrapper d-lg-none" id="dash-font-fab-wrapper">
    <!-- Opciones desplegables -->
    <div class="dash-font-fab-menu" [class.open]="mobileMenuOpen" aria-label="Opciones de tamaño de texto">
        <button type="button"
            class="dash-font-fab-option"
            [class.active]="(currentFontSize$ | async) === 'L'"
            (click)="setFontSize('L'); mobileMenuOpen = false"
            title="Texto grande"
            aria-label="Texto grande">L</button>
        <button type="button"
            class="dash-font-fab-option"
            [class.active]="(currentFontSize$ | async) === 'M'"
            (click)="setFontSize('M'); mobileMenuOpen = false"
            title="Texto mediano"
            aria-label="Texto mediano">M</button>
        <button type="button"
            class="dash-font-fab-option"
            [class.active]="(currentFontSize$ | async) === 'S'"
            (click)="setFontSize('S'); mobileMenuOpen = false"
            title="Texto estándar"
            aria-label="Texto estándar">S</button>
    </div>

    <!-- Botón principal FAB -->
    <button type="button"
        class="dash-font-fab-btn"
        (click)="toggleMobileFontMenu()"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-label="Cambiar tamaño de texto"
        title="Accesibilidad: tamaño de texto">
        <i class="bi bi-type-h1" *ngIf="!mobileMenuOpen"></i>
        <i class="bi bi-x-lg" *ngIf="mobileMenuOpen"></i>
        <span class="dash-font-fab-badge">{{ currentFontSize$ | async }}</span>
    </button>
</div>
