                    <a class="nav-link" routerLink="/dashboard/libros" routerLinkActive="active">Libros</a>

                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/atrasadas" routerLinkActive="active">Devoluciones

                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard/historial" routerLinkActive="active">Reportes</a>

                <li class="nav-item dropdown">

                            </a>
                        </li>
                    </ul>
                </li>

            <div class="dash-a11y-dropdown-wrapper d-none d-lg-flex ms-auto" (click)="$event.stopPropagation()">
                <button type="button"
                    class="dash-a11y-circle-btn"
                    (click)="toggleAccessibilityDropdown()"
                    [attr.aria-expanded]="accessibilityDropdownOpen"
                    aria-label="Opciones de accesibilidad"
                    title="Accesibilidad">
                    <i class="bi bi-universal-access"></i>
                </button>
                <div class="dash-a11y-dropdown-panel" [class.open]="accessibilityDropdownOpen">
                    <!-- Sección 1: Tamaño de letra -->
                    <div class="dash-a11y-section">
                        <span class="dash-a11y-section-title">Tamaño de letra</span>
                        <div class="btn-group dash-font-group" role="group" aria-label="Tamaño de fuente">
                            <button type="button"
                                class="btn btn-dash-font"
                                [class.active]="(currentFontSize$ | async) === 'S'"
                                (click)="setFontSize('S')"
                                title="Texto estándar"
                                aria-label="Texto estándar">S</button>
                            <button type="button"
                                class="btn btn-dash-font"
                                [class.active]="(currentFontSize$ | async) === 'M'"
                                (click)="setFontSize('M')"
                                title="Texto mediano"
                                aria-label="Texto mediano">M</button>
                            <button type="button"
                                class="btn btn-dash-font"
                                [class.active]="(currentFontSize$ | async) === 'L'"
                                (click)="setFontSize('L')"
                                title="Texto grande"
                                aria-label="Texto grande">L</button>
                        </div>
                    </div>
                    <!-- Sección 2: Daltonismo -->
                    <div class="dash-a11y-section">
                        <span class="dash-a11y-section-title">Daltonismo</span>
                        <div class="dash-a11y-colorblind-options">
                            <label class="dash-a11y-cb-option">
                                <input type="radio" name="dash-colorblind" value="none"
                                    [checked]="(colorblindMode$ | async) === 'none'"
                                    (change)="setColorblindMode('none')" />
                                <span class="dash-a11y-cb-dot none"></span>
                                Ninguna
                            </label>
                            <label class="dash-a11y-cb-option">
                                <input type="radio" name="dash-colorblind" value="deuteranomaly"
                                    [checked]="(colorblindMode$ | async) === 'deuteranomaly'"
                                    (change)="setColorblindMode('deuteranomaly')" />
                                <span class="dash-a11y-cb-dot deuteranomaly"></span>
                                Deuteranomalía (verde)
                            </label>
                            <label class="dash-a11y-cb-option">
                                <input type="radio" name="dash-colorblind" value="protanomaly"
                                    [checked]="(colorblindMode$ | async) === 'protanomaly'"
                                    (change)="setColorblindMode('protanomaly')" />
                                <span class="dash-a11y-cb-dot protanomaly"></span>
                                Protanomalía (rojo)
                            </label>
                            <label class="dash-a11y-cb-option">
                                <input type="radio" name="dash-colorblind" value="tritanomaly"
                                    [checked]="(colorblindMode$ | async) === 'tritanomaly'"
                                    (change)="setColorblindMode('tritanomaly')" />
                                <span class="dash-a11y-cb-dot tritanomaly"></span>
                                Tritanomalía (azul)
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

                <label class="dash-a11y-cb-option">
