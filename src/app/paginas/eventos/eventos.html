<!-- ── Título ──────────────────────────────────────────────────────────── -->
<div class="container mt-5 mb-4">
    <h2 class="fw-bold text-primary text-center custom-titulo pb-2">Eventos y Actividades Culturales</h2>
    <p class="text-center text-muted fs-5">Participa en nuestras iniciativas educativas, artísticas y recreativas.</p>
</div>

<!-- ── Filtros ──────────────────────────────────────────────────────────── -->
<div class="container mb-4">
    <div class="filtros-panel p-4 rounded-4 shadow-sm">
        <div class="row g-3 align-items-end">

            <!-- Tipo de actividad -->
            <div class="col-12 col-md-4">
                <label for="filtro-tipo" class="form-label fw-semibold text-secondary small">
                    <i class="bi bi-tag me-1"></i> Tipo de actividad
                </label>
                <select id="filtro-tipo" class="form-select rounded-pill border-0 shadow-sm"
                        [(ngModel)]="tipoSeleccionado">
                    <option value="">Todos los tipos</option>
                    <option *ngFor="let t of tiposActividad" [value]="t.valor">{{ t.label }}</option>
                </select>
            </div>

            <!-- Fecha desde -->
            <div class="col-12 col-md-3">
                <label for="filtro-desde" class="form-label fw-semibold text-secondary small">
                    <i class="bi bi-calendar2-check me-1"></i> Desde
                </label>
                <input type="date" id="filtro-desde" class="form-control rounded-pill border-0 shadow-sm"
                       [(ngModel)]="fechaDesde">
            </div>

            <!-- Fecha hasta -->
            <div class="col-12 col-md-3">
                <label for="filtro-hasta" class="form-label fw-semibold text-secondary small">
                    <i class="bi bi-calendar2-x me-1"></i> Hasta
                </label>
                <input type="date" id="filtro-hasta" class="form-control rounded-pill border-0 shadow-sm"
                       [(ngModel)]="fechaHasta">
            </div>

            <!-- Botón buscar -->
            <div class="col-12 col-md-2 d-grid">
                <button class="btn btn-buscar rounded-pill fw-semibold" (click)="buscarActividades()">
                    <i class="bi bi-search me-1"></i> Buscar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ── Lista de actividades ─────────────────────────────────────────────── -->
<div class="container mb-5">

    <!-- Cargando -->
    <div *ngIf="cargando" class="text-center py-5">
        <div class="spinner-border text-primary" style="width:3rem;height:3rem;" role="status"></div>
        <p class="mt-3 text-muted">Cargando actividades…</p>
    </div>

    <!-- Error de conexión -->
    <div *ngIf="!cargando && error" class="alert alert-danger rounded-4 text-center py-4">
        <i class="bi bi-wifi-off fs-3 d-block mb-2"></i>
        No se pudo conectar con el servidor. Intente nuevamente más tarde.
    </div>

    <!-- Sin resultados -->
    <div *ngIf="!cargando && !error && actividades.length === 0" class="text-center py-5">
        <i class="bi bi-calendar-x fs-1 text-muted d-block mb-3"></i>
        <p class="text-muted fs-5">No hay actividades disponibles con los filtros seleccionados.</p>
    </div>

    <!-- Cards -->
    <div *ngIf="!cargando && !error && actividades.length > 0"
         class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col" *ngFor="let act of actividades">
            <app-actividad-card [actividad]="act"></app-actividad-card>
        </div>
    </div>

</div>

<!-- ── Calendario ───────────────────────────────────────────────────────── -->
<div class="container calendar-container mb-5">
    <div class="calendar-header mb-3 d-flex justify-content-between align-items-center">
        <button class="btn btn-outline-primary btn-sm" (click)="prevMonth()"><i class="bi bi-chevron-left"></i></button>
        <h4 class="fw-bold text-center mb-0">{{ calendarTitle }}</h4>
        <button class="btn btn-outline-primary btn-sm" (click)="nextMonth()"><i class="bi bi-chevron-right"></i></button>
    </div>

    <div class="calendar-grid">
        <div *ngFor="let day of days" class="calendar-cell"
            [class.today]="day.day === currentDate.getDate() && calendarTitle.includes(monthNames[currentDate.getMonth()])">
            <div class="calendar-day">{{ day.day }}</div>
            <div *ngIf="day.events.length > 0" class="event-bullet" title="{{ day.events.join(', ') }}"></div>
        </div>
    </div>
</div>
